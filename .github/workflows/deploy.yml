# Publishes the site to GitHub Pages on every push to main.
#
# Free: GitHub Pages and GitHub Actions cost nothing for public repositories,
# and no payment method is attached to the account, so nothing can be billed.
#
# The site is built as a PREVIEW (hidden from search engines). To go live,
# change NEXT_PUBLIC_SITE_STAGE below to "production" — see src/lib/site.ts.
name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push supersedes an older one still running.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - id: pages
        uses: actions/configure-pages@v5

      - run: npm ci

      - run: npm run build
        env:
          # "/<repo-name>" on github.io, empty on a custom domain — set automatically.
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_SITE_STAGE: preview

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
